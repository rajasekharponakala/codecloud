# Builds the shared lab images under content/images/ and publishes them to GHCR, so lab hosts
# pull them instead of building (set CODECLOUD_LAB_IMAGE_REGISTRY=ghcr.io/<owner>/codecloud-labs).
# The weekly run picks up security updates in the base images.
name: Lab images

on:
  push:
    branches: [main]
    paths:
      - content/images/**
  schedule:
    - cron: "23 4 * * 1"   # Mondays, 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: echo "images=$(find content/images -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.image }}
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.list.outputs.images) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "repo=ghcr.io/${OWNER,,}/codecloud-labs/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: content/images/${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: |
            ${{ steps.name.outputs.repo }}:latest
            ${{ steps.name.outputs.repo }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
