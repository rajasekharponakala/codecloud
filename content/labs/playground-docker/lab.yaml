id: playground-docker
kind: playground
title: Docker playground
description: A private Docker Engine with the Compose and Buildx plugins. Build, run and break containers for an hour.
difficulty: beginner
duration_minutes: 60
tags: [docker, playground]
environment:
  image: docker:29-dind
  command: []
  privileged: true
  memory_mb: 1024
  cpus: 1
  shell: /bin/sh
  hostname: docker-host
  env:
    DOCKER_TLS_CERTDIR: ""
  ready_check: docker info >/dev/null 2>&1
  ready_timeout_seconds: 90
