id: aws-cli-moto
title: "AWS CLI fundamentals: S3, DynamoDB and IAM (emulated)"
description: Practise the AWS CLI against Moto, an open-source local emulator of AWS — no account, no bill.
difficulty: beginner
duration_minutes: 45
tags: [cloud, aws]
environment:
  build: ../../images/aws-moto
  memory_mb: 512
  cpus: 1
  hostname: cloud-shell
  env:
    # Make Moto know AWS-managed IAM policies such as ReadOnlyAccess.
    MOTO_IAM_LOAD_MANAGED_POLICIES: "true"
  setup: |
    nohup moto_server -H 127.0.0.1 -p 5000 >/var/log/moto.log 2>&1 &
    for i in $(seq 1 30); do curl -fs http://127.0.0.1:5000/moto-api/ >/dev/null && break; sleep 1; done
    echo "quarterly numbers" > /root/report.txt
tasks:
  - id: s3-quiz
    type: quiz
    prompt: S3 bucket names must be…
    options: [Unique within your account, Globally unique across all AWS accounts, Unique per region only, Uppercase]
    answer: 1
  - id: bucket
    type: task
    prompt: Create an S3 bucket named `codecloud-artifacts`.
    check: |
      aws s3api head-bucket --bucket codecloud-artifacts >/dev/null 2>&1 || { echo "bucket codecloud-artifacts does not exist"; exit 1; }
    solution: aws s3 mb s3://codecloud-artifacts
  - id: upload
    type: task
    prompt: Upload `/root/report.txt` to `s3://codecloud-artifacts/reports/2026/report.txt`, and enable versioning on the bucket.
    check: |
      [ "$(aws s3 cp s3://codecloud-artifacts/reports/2026/report.txt - 2>/dev/null)" = "quarterly numbers" ] || { echo "the object is missing or has the wrong content"; exit 1; }
      [ "$(aws s3api get-bucket-versioning --bucket codecloud-artifacts --query Status --output text 2>/dev/null)" = "Enabled" ] || { echo "versioning is not enabled"; exit 1; }
    solution: |
      aws s3 cp /root/report.txt s3://codecloud-artifacts/reports/2026/report.txt
      aws s3api put-bucket-versioning --bucket codecloud-artifacts --versioning-configuration Status=Enabled
  - id: dynamodb
    type: task
    prompt: Create a DynamoDB table `orders` with partition key `order_id` (string) and on-demand (pay-per-request) billing.
    check: |
      d=$(aws dynamodb describe-table --table-name orders 2>/dev/null) || { echo "table orders does not exist"; exit 1; }
      echo "$d" | jq -e '.Table.KeySchema[] | select(.AttributeName=="order_id" and .KeyType=="HASH")' >/dev/null || { echo "partition key must be order_id"; exit 1; }
      echo "$d" | jq -e '.Table.AttributeDefinitions[] | select(.AttributeName=="order_id" and .AttributeType=="S")' >/dev/null || { echo "order_id must be a string"; exit 1; }
      [ "$(echo "$d" | jq -r '.Table.BillingModeSummary.BillingMode')" = "PAY_PER_REQUEST" ] || { echo "billing mode must be PAY_PER_REQUEST"; exit 1; }
    solution: |
      aws dynamodb create-table --table-name orders \
        --attribute-definitions AttributeName=order_id,AttributeType=S \
        --key-schema AttributeName=order_id,KeyType=HASH \
        --billing-mode PAY_PER_REQUEST
  - id: iam
    type: task
    prompt: Create an IAM user `ci-deployer` and attach the AWS managed policy `ReadOnlyAccess` to it.
    check: |
      aws iam get-user --user-name ci-deployer >/dev/null 2>&1 || { echo "user ci-deployer does not exist"; exit 1; }
      aws iam list-attached-user-policies --user-name ci-deployer --query 'AttachedPolicies[].PolicyArn' --output text | grep -q 'arn:aws:iam::aws:policy/ReadOnlyAccess' || { echo "ReadOnlyAccess is not attached"; exit 1; }
    solution: |
      aws iam create-user --user-name ci-deployer
      aws iam attach-user-policy --user-name ci-deployer --policy-arn arn:aws:iam::aws:policy/ReadOnlyAccess
