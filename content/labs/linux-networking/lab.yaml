id: linux-networking
title: "Linux networking: addresses, ports, DNS and HTTP"
description: Inspect interfaces and listening sockets, run a service, and troubleshoot name resolution and HTTP.
difficulty: beginner
duration_minutes: 40
tags: [linux, networking]
environment:
  build: ../../images/workstation
  memory_mb: 256
  cpus: 0.5
  hostname: net-lab
  setup: |
    mkdir -p /srv/www
    echo '<h1>codecloud</h1>' > /srv/www/index.html
    cp "$(readlink -f /usr/bin/python3)" /usr/local/bin/legacy-agent
    nohup legacy-agent -m http.server 7431 --bind 127.0.0.1 --directory /tmp >/dev/null 2>&1 &
    sleep 1
tasks:
  - id: port-quiz
    type: quiz
    prompt: Which command lists listening TCP sockets together with the owning process?
    options: ["ip route", "ss -tlnp", "dig +short", "ping -c1"]
    answer: 1
  - id: mystery-port
    type: task
    prompt: A process named `legacy-agent` is listening on a TCP port on localhost. Write that port number to `/root/port.txt`.
    hint: "`ss -tlnp` shows the port and the process name."
    check: |
      [ "$(tr -d '[:space:]' < /root/port.txt 2>/dev/null)" = "7431" ] || { echo "/root/port.txt is not the right port"; exit 1; }
    solution: ss -tlnp | awk '/legacy-agent/ {split($4, a, ":"); print a[length(a)]}' > /root/port.txt
  - id: ip-address
    type: task
    prompt: Write this machine's IPv4 address on `eth0` (without the prefix length) to `/root/ip.txt`.
    check: |
      expected=$(ip -4 -o addr show eth0 | awk '{print $4}' | cut -d/ -f1)
      [ "$(tr -d '[:space:]' < /root/ip.txt 2>/dev/null)" = "$expected" ] || { echo "/root/ip.txt does not contain the eth0 address"; exit 1; }
    solution: ip -4 -o addr show eth0 | awk '{print $4}' | cut -d/ -f1 > /root/ip.txt
  - id: hosts
    type: task
    prompt: Make the name `app.internal` resolve to `127.0.0.1` on this machine.
    check: |
      [ "$(getent hosts app.internal | awk '{print $1}')" = "127.0.0.1" ] || { echo "app.internal does not resolve to 127.0.0.1"; exit 1; }
    solution: echo '127.0.0.1 app.internal' >> /etc/hosts
  - id: web
    type: task
    prompt: |
      Serve the directory `/srv/www` over HTTP on port `8080` (any server will do, it must keep
      running in the background) so that `curl http://app.internal:8080/` returns the page.
    hint: "`nohup python3 -m http.server 8080 --directory /srv/www >/dev/null 2>&1 &`"
    check: |
      curl -fsS --max-time 5 http://app.internal:8080/ | grep -q codecloud || { echo "http://app.internal:8080/ did not return the page"; exit 1; }
    solution: |
      nohup python3 -m http.server 8080 --directory /srv/www >/dev/null 2>&1 &
      sleep 1
